name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install tools browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/tools-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/tools-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify tools on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tools-browser/node_modules/playwright
        run: |
          node scripts/verify-tools.cjs
          node scripts/verify-shizhi.cjs
          node scripts/verify-trend.cjs

      - name: Save tools screenshots and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-browser-verification
          path: tool-verification
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
